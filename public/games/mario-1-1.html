<script>
(() => {
'use strict';
/* === DESIGN / ENGINE CONTRACT ===
   C2 local game. Pixel-art cartridge; variance 3, motion 7, density D4.
   Native canvas sprites and synthesized sounds keep this one file offline.
   World units are NES-like 16px tiles; fixed 60Hz physics do not depend on RAF.
   Layout reconstructs 1-1; rendering/physics are newly implemented, not a ROM.
*/
const $=id=>document.getElementById(id), canvas=$('game'), ctx=canvas.getContext('2d');
const T=16, GROUND=208, VIEW_W=432, VIEW_H=243, LEVEL_W=3392, DT=1/60;
const keys=new Set(), touches=new Map(), pressed=new Set();
const keyMap={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowDown:'down',KeyS:'down',Space:'jump',KeyZ:'jump',ArrowUp:'jump',KeyW:'jump',ShiftLeft:'run',ShiftRight:'run',KeyX:'run'};
let state='title', world, player, camera=0, score=0, coins=0, lives=3, time=400, ticks=0, checkpoint=0, deathClock=0, winClock=0, jumpBuffer=0, coyote=0, fireCooldown=0, pipeClock=0, pipeMode='', best=0;
let particles=[], popups=[], items=[], shots=[], flagY=48, last=0, accumulator=0, soundEnabled=false, audio=null, nextNote=0, noteIndex=0, previousJump=false;
let demoMode=false,demoFrame=-3;
// Recorded controller inputs, not teleportation: the demo runs the same physics.
const demoJumps=[[89,129],[140,180],[202,242],[257,297],[329,369],[415,455],[470,510],[520,560],[575,615],[645,685],[717,757],[774,814],[852,892],[924,960],[984,1024],[1025,1065],[1092,1132],[1147,1187],[1209,1249],[1250,1290],[1330,1342]];
try{best=Number(localStorage.getItem('mario11-best-v1'))||0}catch{}
const held=a=>demoMode?(demoFrame>=0&&(a==='right'||a==='run'||a==='jump'&&demoJumps.some(([start,end])=>demoFrame>=start&&demoFrame<end))):[...keys].some(k=>keyMap[k]===a)||[...touches.values()].includes(a);
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const announce=text=>{$('announcement').textContent=text};
/* === LEVEL DATA === */
function makeWorld(underground=false){
 const w={underground,tiles:new Map(),pipes:[],enemies:[],looseCoins:[],width:underground?384:LEVEL_W};
 const put=(x,y,type='brick',content=null)=>w.tiles.set(x+','+y,{x:x*T,y:y*T,w:T,h:T,type,content,bump:0,used:false});
 const span=(a,b,y,type='brick')=>{for(let x=a;x<=b;x++)put(x,y,type)};
 if(underground){
  span(0,23,13,'ground');span(0,23,14,'ground');span(0,23,1);for(let y=2;y<13;y++){put(0,y);put(23,y)}
  for(let x=4;x<18;x++)put(x,10);for(let x=5;x<17;x++)for(let y=6;y<9;y++)w.looseCoins.push({x:x*T+4,y:y*T,w:8,h:12,taken:false});
  w.pipes.push({x:20*T,y:11*T,w:32,h:32,exit:true});return w;
 }
 for(let x=0;x<212;x++)if(!((x>=69&&x<=70)||(x>=86&&x<=88)||(x>=153&&x<=154))){put(x,13,'ground');put(x,14,'ground')}
 put(16,9,'question','coin');put(20,9);put(21,9,'question','power');put(22,9);put(23,9,'question','coin');put(24,9);put(22,5,'question','coin');
 for(const [x,h,secret] of [[28,2,false],[38,3,false],[46,4,false],[57,4,true],[163,2,false],[179,2,false]])w.pipes.push({x:x*T,y:GROUND-h*T,w:32,h:h*T,secret});
 put(64,8,'hidden','life');put(77,9);put(78,9,'question','power');put(79,9);span(80,87,5);span(91,93,5);put(94,5,'question','coin');put(94,9,'brick','multi');
 put(100,9);put(101,9,'brick','star');for(const x of [106,109,112])put(x,9,'question','coin');put(109,5,'question','power');put(118,9);span(121,123,5);span(128,131,5);put(129,9);put(130,9);w.tiles.get('129,5').type='question';w.tiles.get('129,5').content='coin';w.tiles.get('130,5').type='question';w.tiles.get('130,5').content='coin';
 for(let n=0;n<4;n++){for(let j=0;j<=n;j++)put(134+n,12-j,'stone');for(let j=0;j<4-n;j++)put(140+n,12-j,'stone')}
 for(let n=0;n<4;n++){for(let j=0;j<=n;j++)put(148+n,12-j,'stone');for(let j=0;j<4-n;j++)put(155+n,12-j,'stone')}for(let j=0;j<4;j++)put(152,12-j,'stone');
 put(168,9);put(169,9);put(170,9,'question','coin');put(171,9);
 for(let n=0;n<8;n++)for(let j=0;j<=n;j++)put(181+n,12-j,'stone');for(let j=0;j<8;j++)put(189,12-j,'stone');put(198,12,'stone');
 for(const x of [22,40,51,53,80,82,97,99,114,116,124,126,128,174,176])w.enemies.push({x:x*T,y:GROUND-14,w:14,h:14,vx:-26,vy:0,type:'goomba',active:false,dead:0});
 w.enemies.push({x:107*T,y:GROUND-23,w:14,h:23,vx:-26,vy:0,type:'koopa',active:false,dead:0});return w;
}
function spawn(x=40){player={x,y:GROUND-15,w:12,h:15,vx:0,vy:0,onGround:false,facing:1,power:0,invuln:0,star:0,walk:0};jumpBuffer=0;coyote=0;previousJump=false}
function clearInput(){keys.clear();touches.clear();pressed.clear();previousJump=false;jumpBuffer=0;document.querySelectorAll('.touch').forEach(b=>b.classList.remove('active'))}
function setState(next){state=next;const labels={title:'READY PLAYER ONE',playing:'PLAYING',paused:'PAUSED',dying:'TRY AGAIN',gameover:'GAME OVER',winning:'COURSE CLEAR',won:'COURSE CLEAR',pipe:'SECRET PASSAGE'};$('state-label').textContent=labels[next];$('pause').disabled=!['playing','paused'].includes(next);$('pause').setAttribute('aria-label',next==='paused'?'계속하기':'일시정지')}
function showPanel(title,description,button,kicker='WORLD 1–1'){ $('message').textContent=title;$('description').textContent=description;$('start').textContent=button;$('kicker').textContent=kicker;$('overlay').hidden=false;announce(title+' '+description)}
function reset(){demoMode=false;score=0;coins=0;lives=3;checkpoint=0;time=400;camera=0;ticks=0;flagY=48;world=makeWorld();items=[];shots=[];particles=[];popups=[];spawn();clearInput();setState('playing');$('overlay').hidden=true;canvas.focus();nextNote=0;noteIndex=0;announce('월드 1-1 시작!')}
function startDemo(){reset();demoMode=true;demoFrame=-3;$('state-label').textContent='演示 · 按方向键接管控制';announce('这是通关演示。按方向键即可亲自游玩。')}
function takeOver(){if(demoMode){demoMode=false;clearInput();$('state-label').textContent='PLAYING';announce('已切换到手动控制。')}}
function resume(){clearInput();setState('playing');$('overlay').hidden=true;canvas.focus();nextNote=0}
function pause(){if(state==='playing'){setState('paused');clearInput();showPanel('잠깐 쉬어가기','준비되면 모험을 이어가세요.','계속하기 ↗','PAUSED')}else if(state==='paused')resume()}
/* === SELF-CONTAINED CHIP AUDIO === */
function tone(freq,duration=.1,delay=0,type='square',gain=.045,endFreq=null){
 if(!soundEnabled||!audio||audio.state!=='running')return;
 const at=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,at);if(endFreq)o.frequency.exponentialRampToValueAtTime(endFreq,at+duration);g.gain.setValueAtTime(gain,at);g.gain.exponentialRampToValueAtTime(.001,at+duration);o.connect(g);g.connect(audio.destination);o.start(at);o.stop(at+duration+.015);
}
function sfx(name){const seq={coin:[[988,.07],[1319,.18]],jump:[[220,.14,0,'square',.035,740]],bump:[[125,.075]],stomp:[[160,.08,0,'triangle',.13,50]],power:[[262,.08],[330,.08],[392,.08],[523,.1],[659,.12],[784,.15]],death:[[440,.12],[415,.12],[392,.12],[370,.15],[330,.2],[220,.35]],win:[[262,.1],[330,.1],[392,.1],[523,.2],[392,.12],[523,.35]],fire:[[700,.09,0,'square',.035,120]],pipe:[[220,.1],[165,.1],[110,.15]],life:[[659,.08],[784,.08],[1319,.12],[1047,.08],[1175,.08],[1568,.2]]}[name]||[];let delay=0;for(const n of seq){tone(n[0],n[1],delay,n[3]||'square',n[4]||.04,n[5]);delay+=n[1]*.82}}
async function toggleSound(){soundEnabled=!soundEnabled;try{if(soundEnabled){audio??=new (window.AudioContext||window.webkitAudioContext)();await audio.resume();nextNote=0}}catch{soundEnabled=false;announce('이 브라우저에서는 소리를 재생할 수 없어요. 게임은 계속할 수 있어요.')}$('sound').setAttribute('aria-pressed',String(soundEnabled));$('sound').setAttribute('aria-label',soundEnabled?'소리 끄기':'소리 켜기');$('sound').title=(soundEnabled?'소리 끄기':'소리 켜기')+' (M)';$('sound').style.color=soundEnabled?'#ffd379':''}
const melody=[76,76,0,76,0,72,76,0,79,0,0,0,67,0,0,0,72,0,0,67,0,0,64,0,0,69,0,71,0,70,69,0,67,76,79,81,0,77,79,0,76,0,72,74,71,0,0,0];
function music(){if(!audio||!soundEnabled||state!=='playing')return;if(audio.currentTime<nextNote)return;const n=melody[noteIndex++%melody.length];if(n)tone(440*2**((n-69)/12),.105,0,'square',.017);if(noteIndex%4===0)tone(world.underground?65:131,.13,0,'triangle',.035);nextNote=audio.currentTime+(time<100?.112:.15)}
/* === COLLISION: SWEPT, AXIS-SEPARATED, LOCAL TILE QUERY === */
function solids(body,includeHidden=false){const out=[];for(let x=Math.floor(body.x/T)-1;x<=Math.floor((body.x+body.w)/T)+1;x++)for(let y=Math.floor(body.y/T)-1;y<=Math.floor((body.y+body.h)/T)+1;y++){const b=world.tiles.get(x+','+y);if(b&&(b.type!=='hidden'||includeHidden))out.push(b)}return out.concat(world.pipes)}
function move(body,dt,headHits=false){
 const dx=body.vx*dt;body.x+=dx;let wall=false;
 for(const b of solids(body))if(overlap(body,b)){if(dx>0)body.x=b.x-body.w;else if(dx<0)body.x=b.x+b.w;else continue;wall=true}
 if(wall)body.vx=0;
 const oldY=body.y,dy=body.vy*dt;body.y+=dy;body.onGround=false;

 if(ticks%10===0||state==='title'){const pct=state==='won'?100:world.underground?Math.round(57/198*100):clamp(Math.floor((player.x-40)/(198*T-40)*100),0,100);$('progress').style.width=pct+'%';$('progress-label').textContent=pct+'%';document.querySelector('.track').setAttribute('aria-valuenow',pct)}
}
/* === INPUT AND LIFECYCLE === */
function startAction(){if(state==='paused')resume();else if(['title','gameover','won'].includes(state))reset()}
$('start').addEventListener('click',startAction);$('pause').addEventListener('click',pause);$('sound').addEventListener('click',toggleSound);$('demo').addEventListener('click',startDemo);
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await $('shell').requestFullscreen()}catch{announce('전체 화면을 사용할 수 없어요. 브라우저 창을 넓혀 주세요.')}}$('fullscreen').addEventListener('click',fullscreen);
window.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const action=keyMap[e.code];if(action){if(e.target instanceof HTMLButtonElement&&e.code==='Space')return;e.preventDefault();takeOver();if(!keys.has(e.code))pressed.add(action);keys.add(e.code)}if(e.repeat)return;if(e.code==='Enter'&&e.target instanceof HTMLButtonElement)return;if(e.code==='Enter'){e.preventDefault();startAction()}if(e.code==='KeyP'||e.code==='Escape')pause();if(e.code==='KeyR')reset();if(e.code==='KeyM')toggleSound();if(e.code==='KeyF')fullscreen()});
window.addEventListener('keyup',e=>{keys.delete(e.code);if(keyMap[e.code])e.preventDefault()});
document.querySelectorAll('.touch').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();takeOver();b.setPointerCapture(e.pointerId);touches.set(e.pointerId,b.dataset.action);pressed.add(b.dataset.action);b.classList.add('active')});const release=e=>{touches.delete(e.pointerId);b.classList.remove('active')};b.addEventListener('pointerup',release);b.addEventListener('pointercancel',release);b.addEventListener('lostpointercapture',release)});
window.addEventListener('blur',()=>{clearInput();if(state==='playing')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden){clearInput();if(state==='playing')pause()}last=0;accumulator=0});
function frame(now){if(!last)last=now;const elapsed=Math.min((now-last)/1000,.1);last=now;accumulator+=elapsed;while(accumulator>=DT){update(DT);accumulator-=DT}music();draw();requestAnimationFrame(frame)}
world=makeWorld();spawn();setState('title');draw();requestAnimationFrame(frame);
})();
</script>
